# Default values for answer-coalesce.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
ac:
  image:
    repository: ghcr.io/ranking-agent/answercoalesce
    tag: latest
  service:
    type: ClusterIP
    port: 80
  containerPort: 8080
  # uvicorn worker processes. Each one opens its own DuckDB connection per
  # worker thread, and every connection carries its own buffer pool
  # (AC_DUCKDB_QUERY_MEMORY_LIMIT, 1GB by default), so raising this raises the
  # pod's memory ceiling as well.
  workers: 4
  resources:
    requests:
      memory: 5Gi
      cpu: 250m
    limits:
      memory: 10Gi
      cpu: 500m
  duckdb:
    # DuckDB dump downloaded onto the data volume by an init container on first
    # start, and handed to the app as AC_DUCKDB_PATH=/data/answer-coalesce.duckdb.
    # The download is skipped when the file is already present and its size
    # matches the server's, so pod restarts don't re-fetch several GB.
    url: "https://stars.renci.org/var/translator/ac/answer-coalesce-hierarchy-pruned-2026-9-14.duckdb"
    storage:
      # Roughly twice the dump size: a replacement dump is downloaded alongside
      # the current one before it is swapped in.
      size: 20Gi
      class:
    initresources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1000m
  # Scratch volume mounted at /tmp, where DuckDB spills query temp data. The
  # app caps each connection's spill at AC_DUCKDB_QUERY_MAX_TEMP_DIRECTORY_SIZE
  # (8GB by default) and opens one connection per worker thread, so this is a
  # backstop against a heavy query eating the node's ephemeral storage.
  tmpSizeLimit: 10Gi
  # Extra environment variables for the web container. The AnswerCoalesce
  # defaults already match the runtime values upstream recommends
  # (AC_DUCKDB_QUERY_MEMORY_LIMIT=1GB, AC_DUCKDB_QUERY_MAX_TEMP_DIRECTORY_SIZE=8GB,
  # AC_DUCKDB_QUERY_THREADS=2), so set these only to deliberately deviate.
  # NODE_NORMALIZER_URL is also read from the environment.
  env: {}

web:
  serverHostName: "hostname"

busybox:
     image:
        repository: curlimages/curl
        tag: 8.20.0

# fsGroup lets the (non-root) init container write the dump to the data volume.
podSecurityContext:
  fsGroup: 1000

nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: false
  host: "hostname"
  class: ""
  pathType: "ImplementationSpecific"
  path: "/"
  tls:
    enabled: false
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
#    nginx.ingress.kubernetes.io/rewrite-target: /$2

x_trapi:
  maturity:
    value: "maturity"
  location:
    value: "location"

app:
  affinity: {}
  tolerations: {}
  nodeSelector: {}
