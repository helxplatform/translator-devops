apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "name-lookup.fullname" . }}-configmap
  labels:
    {{- include "name-lookup.labels" . | nindent 4 }}
data:
  download.sh: |-
    #!/bin/bash
    set -xa
    DATA_DIR="/var/solr/data"
    CORE_DIR="${DATA_DIR}/name_lookup"
    BACKUP_ZIP="${DATA_DIR}/snapshot.backup.tar.gz"
    BACKUP_URL="{{ .Values.dataUrl }}"

    # The backup is a self-contained Solr core (config + schema + index). If it is
    # already extracted, keep it: this makes the init container idempotent, so a
    # pod restart does not wipe a good core and leave Solr empty
    # (translator-devops#609).
    if [ -f "${CORE_DIR}/core.properties" ]; then
      echo "Core already present at ${CORE_DIR}; skipping download."
      exit 0
    fi

    # Otherwise start clean and download.
    rm -rf ${DATA_DIR}/*

    # Download the file with retries if the download fails or if there is an existing file we can continue.
    wget -c --progress=dot:giga --tries=10 --waitretry=10 --timeout=60 --read-timeout=30 -O ${BACKUP_ZIP} ${BACKUP_URL}

    # Extract the core into the Solr home. Solr auto-discovers name_lookup on startup,
    # with its schema and config baked in -- nothing else to set up.
    tar -xf ${BACKUP_ZIP} -C ${DATA_DIR}
    rm ${BACKUP_ZIP}

  restore.sh: |-
    #!/bin/sh
    #
    # The backup already contains the loaded index AND the schema/config, so there
    # is no collection to create, no replication restore, and no fields to add. The
    # only post-restore work is deleting blocklisted CURIEs, if a blocklist is set.
    # (This makes the job idempotent and safe to re-run -- see NameResolution#185.)

    BLOCKLIST_DIR="/var/blocklist"
    BLOCKLIST_CHUNK_SIZE=500

    # Download the Blocklist file. We do this before turning on xtrace (`set -xa`) so that we don't record
    # the GitHub authorization token in the Kubernetes logs.
    {{ if .Values.blocklist.url }}
      wget \
        -O ${BLOCKLIST_DIR}/blocklist.txt \
        {{ if .Values.blocklist.secrets.github_personal_access_token}}--header "Authorization: Token $GITHUB_PERSONAL_ACCESS_TOKEN" \{{ end }}
        {{ .Values.blocklist.url }}

      CURIE_LIST=$(xargs -I{lin} echo \"{lin}\" < ${BLOCKLIST_DIR}/blocklist.txt)
      echo CURIEs on the Blocklist: ${CURIE_LIST}.
      echo Blocklist CURIEs will be chunked into chunks of ${BLOCKLIST_CHUNK_SIZE}.
    {{ end }}

    # Turn on xtrace and set up config variables.
    set -xa
    COLLECTION_NAME="name_lookup"
    SOLR_SERVER=http://{{ include "name-lookup.fullname" . }}-solr-svc:{{ .Values.solr.service.port }}

    # Wait for Solr and the auto-discovered core to be ready.
    HEALTH_ENDPOINT=${SOLR_SERVER}/solr/${COLLECTION_NAME}/admin/ping
    response=$(wget --spider --server-response ${HEALTH_ENDPOINT} 2>&1 | grep "HTTP/" | awk '{ print $2 }') >&2
    until [ "$response" = "200" ]; do
      response=$(wget --spider --server-response ${HEALTH_ENDPOINT} 2>&1 | grep "HTTP/" | awk '{ print $2 }') >&2
      echo "  -- SOLR is unavailable - sleeping"
      sleep 3
    done
    echo "Solr core ${COLLECTION_NAME} is up."

    # Delete the blocklist terms from the Solr database.
    {{ if .Values.blocklist.url }}

    # Split the blocklist into files of 500 CURIEs each.
    rm -rf ${BLOCKLIST_DIR}/blocklist_*
    split -l ${BLOCKLIST_CHUNK_SIZE} ${BLOCKLIST_DIR}/blocklist.txt ${BLOCKLIST_DIR}/blocklist_

    # Delete each blocklist.
    for file in ${BLOCKLIST_DIR}/blocklist_*; do
      CURIE_LIST=$(xargs -I{lin} echo \\\"{lin}\\\" < ${file})

      SOLR_DELETE="{
        'delete': {
          'query': 'curie:(${CURIE_LIST})'
        }}"
      echo SOLR delete query for ${file}: ${SOLR_DELETE}

      wget --post-data "${SOLR_DELETE}" \
      --header='Content-Type:application/json' \
      -O- ${SOLR_SERVER}/solr/${COLLECTION_NAME}/update?commit=true

      sleep 10
    done
    {{ end }}

    exit 0
