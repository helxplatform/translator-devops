{{- /*
  Fail fast rather than quietly deploying a blocklist that cannot authenticate: if the
  blocklist is switched on (blocklist.url set) there must be a token to go with it. The
  token is looked up nil-safely here so that a values file which drops the `secrets` map
  entirely still gets this message instead of a raw nil-pointer error.
*/ -}}
{{- if and .Values.blocklist.url (not (.Values.blocklist.secrets).github_personal_access_token) }}
{{- fail "blocklist.url is set but blocklist.secrets.github_personal_access_token is empty. Set the token, or clear blocklist.url to turn the blocklist off. (If the blocklist URL needs no auth, set any non-empty placeholder.)" }}
{{- end }}
{{ if .Values.blocklist.secrets.github_personal_access_token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "name-lookup.fullname" . }}-secrets
  labels:
    {{- include "name-lookup.labels" . | nindent 4 }}
type: Opaque
stringData:
  github_personal_access_token: {{ .Values.blocklist.secrets.github_personal_access_token }}
{{ end }}
