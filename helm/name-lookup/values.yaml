# Default values for name-lookup.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.



webServer:
  replicaCount: 1
  service:
    port: 2433
    type: ClusterIP
  # container port
  port: 2433
  image:
    repository: ghcr.io/ncatstranslator/nameresolution
    tag: v1.5.2

dataUrl: "https://stars.renci.org/var/babel_outputs/2025sep1/nameres/snapshot.backup.tar.gz"
forceRun: false
data:
  babelVersion: 2025sep1
  babelVersionURL: https://github.com/ncatstranslator/Babel/blob/master/releases/2025sep1.md

downloader:
  image:
    repository: ghcr.io/translatorsri/renci-python-image
    tag: latest

# busybox:
#   image:
#     repository: busybox
#     tag: latest

solr:
  service:
    port: 8983
    type: ClusterIP
  # container port
  port: 8983
  image:
    repository: solr
    tag: 9.1
  resources:
    # We tried increasing this to 200Gi. It looks like Solr used the following
    # amounts of memory (as per Sterling Grafana):
    #   - Memory Usage (WSS): 13Gi
    #   - Memory Usage (RSS): 11Gi
    #   - Memory Usage (Cache): 111Gi
    #
    # I think the "cache" here refers to the OS-level page cache, which makes
    # sense, as the Solr indexes occupy around 127Gi.
    #
    # Therefore, I suspect that Solr needs about 32-64Gi to load its indexes
    # and other important content, but will use other memory if it is available
    # to cache content. We'll set this to 64Gi for now, but we should try
    # bombarding these instances with queries to check how valuable increasing
    # the memory to Solr helps with performance.
    #
    requests:
      memory: "32Gi"
      cpu: 4000m
    limits:
      memory: "32Gi"
      cpu: 6000m

  # You can control the nodeSelector/affinity/tolerations settings for Solr with the following settings.
  # Other pods (web, restore, backup) are controlled via app.nodeSelector/affinity/tolerations below.
  nodeSelector:
  affinity:
  tolerations:

  # -Xms == -Xmx so the heap is allocated up front and never resized at runtime.
  # 12G leaves ~20G of a 32Gi container for the OS page cache, which serves the
  # mmap'd ~142G index (the live heap set is only a few GB; see #265/#267).
  heap_mem: "-Xms12G -Xmx12G"

  # G1 GC. We deliberately do NOT pin the young generation (no -XX:NewSize/
  # MaxNewSize): a fixed young gen overrides G1NewSizePercent/G1MaxNewSizePercent
  # and disables the MaxGCPauseMillis pause-time goal. Instead we let G1 size the
  # young gen adaptively against a 200ms pause target, and let IHOP stay adaptive
  # (no -XX:InitiatingHeapOccupancyPercent override). See
  # https://github.com/NCATSTranslator/NameResolution/issues/272
  gc: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:G1MaxNewSizePercent=40 -XX:G1NewSizePercent=5 -XX:G1HeapRegionSize=32M"

  # Solr query cache tuning, applied to the name_lookup collection via the Config
  # API during the restore job (written to the collection's configoverlay.json).
  #
  # The Solr _default configset ships with a 512-entry queryResultCache, which
  # was found to be badly undersized in production (~56% hit rate, 317K evictions)
  # while the filterCache was performing well (99.8% hit ratio, no evictions).
  # See https://github.com/NCATSTranslator/NameResolution/issues/266
  #
  # Solr 9.x already defaults to solr.search.CaffeineCache, so we only need to
  # tune the sizing here. maxRamMB bounds memory regardless of entry count.
  queryResultCache:
    size: 4096
    initialSize: 2048
    maxRamMB: 512
    autowarmCount: 0

  # As of Babel 2023jul13, we need 130G to store the
  # uncompressed backup + 131G Solr database
  # So 300Gi should be enough for the time being.
  storage: 400Gi

  # As far as I know, initresources are only used by the download
  # pod that downloads the Solr backup, which is network-bound,
  # not CPU or memory bound. This used to be 32Gi, but I'm going
  # to reduce it to 1-5Gi. Please increase this if it looks like
  # it'll be helpful.
  initresources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 5Gi
      cpu: 2000m

# You can control the nodeSelector/affinity/tolerations settings for all pods (web, restore, backup) except Solr with the following settings.
app:
  serverName: "infores:sri-name-resolver"
  otel:
    enabled: false
    jaegerHost:
    jaegerPort:
  nodeSelector:
  affinity:
  tolerations:
  resources:
    requests:
      memory: 1Gi
      cpu: 750m
    limits:
      memory: 2Gi
      cpu: 1000m

nameOverride: ""
fullnameOverride: ""

ingress:
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  pathType: "ImplementationSpecific"
  host:
  class:

blocklist:
  # The URL from where to download the blocklist. This should be a simple text file, where each line contains a CURIE.
  # (If this field is blank, all blocklist functionality will be turned off.)
  url:
  # If a GitHub Personal Access Token is necessary to download the above file, it should be set
  # in `blocklist.secrets.github_personal_access_token` in an encrypted file. You can also
  # set this on Kubernetes by running:
  #   kubectl -n $NAMESPACE create secret generic {{name-lookup.fullname}}-secrets --from-literal=github_personal_access_token=github_pat_...
  # The storage necessary to store the blocklist file. This is currently an ephemeral volume, and because we need
  # to use `split` to split this into 500 ID chunks, we actually need TWICE the amount of storage needed to store
  # the blocklist. Luckily, the blocklist is about 7KB right now, so 100Mi should be future proof for a while.
  storage: 100Mi

x_trapi:
  maturity:
    value: "maturity"
  location:
    value: "location"
