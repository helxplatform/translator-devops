# Default values for name-lookup.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.



webServer:
  replicaCount: 1
  service:
    port: 2433
    type: ClusterIP
  # container port
  port: 2433
  image:
    repository: ghcr.io/ncatstranslator/nameresolution
    tag: v1.7.0

dataUrl: "https://stars.renci.org/var/babel_outputs/2026jul22/nameres/snapshot.backup.tar.gz"
forceRun: false
data:
  babelVersion: 2026jul22
  babelVersionURL: https://github.com/ncatstranslator/Babel/blob/master/releases/2026jul22.md
  biolinkModelTag: "v4.4.3"

downloader:
  image:
    repository: ghcr.io/translatorsri/renci-python-image
    tag: latest

# busybox:
#   image:
#     repository: busybox
#     tag: latest

solr:
  service:
    port: 8983
    type: ClusterIP
  # container port
  port: 8983
  image:
    repository: solr
    # Solr load happens using Solr 9.10.0 version, but any Solr 9.10.x should be able to
    # load that database. This allows our frontline database to pick up minor updates.
    # Quoted: unquoted YAML 9.10 parses as the float 9.1, which pulled solr:9.1 and
    # failed core init against a 9.10-built index (NameResolution#278).
    tag: "9.10"

  # The memory limit is the single biggest serving-performance lever. It has to
  # cover the JVM heap (heap_mem below, 16G) AND leave the rest for the OS page
  # cache, which is charged to the cgroup limit and is what actually keeps queries
  # fast: Lucene reads the index through page cache, so the more of the ~111Gi index
  # (Babel 2026jul22) that fits in (limit - heap), the fewer reads fall through to
  # the network (`basic`) disk. A past measurement on a large limit showed ~11-13Gi
  # of JVM RSS against ~111Gi of page cache -- Solr wants close to the whole index
  # cached.
  #
  # 64Gi gives ~48Gi of page cache (~43% of the index) -- a big step up from 32Gi's
  # ~16Gi (~15%), and enough for reasonable performance. If queries are slow and the
  # Grafana page-cache panel shows the cache pinned at (limit - heap) -- or /status
  # reports an index `size` well above (limit - heap), so most of it cannot be
  # cached -- raise the limit further. 128Gi caches essentially the whole index; the
  # Dev instance (most used) is the one to raise first.
  #
  # When you change the memory limit:
  #   - Keep requests == limits. Page cache needs guaranteed (not burstable) memory,
  #     and the node has to actually have it -- check `kubectl describe node`.
  #   - Do NOT raise heap_mem to match. The extra memory should go to page cache, not
  #     the heap. NameRes issues no fq and caches whole query results in
  #     queryResultCache (bounded by maxRamMB in the configset), so 16G of heap is
  #     plenty, and a heap over ~32G also gives up compressed object pointers. See
  #     NameResolution#265.
  #   - cpu and storage do not scale with the memory limit.
  resources:
    requests:
      memory: "64Gi"
      cpu: 4000m
    limits:
      memory: "64Gi"
      cpu: 6000m

  # You can control the nodeSelector/affinity/tolerations settings for Solr with the following settings.
  # Other pods (web, restore, backup) are controlled via app.nodeSelector/affinity/tolerations below.
  nodeSelector:
  affinity:
  tolerations:

  # Keep the JVM heap well below the pod's memory limit so the rest stays available
  # for the OS page cache, which is what actually keeps the ~127Gi index fast (Lucene
  # relies on it). See NameResolution#265 -- raising the memory limit above and tuning
  # the exact heap is tracked there and should be validated under query load.
  heap_mem: "-Xms16G -Xmx16G"
  gc: "-XX:NewSize=4G -XX:MaxNewSize=4G -XX:+UseG1GC -XX:MaxGCPauseMillis=1000 -XX:+UnlockExperimentalVMOptions -XX:G1MaxNewSizePercent=40 -XX:G1NewSizePercent=5 -XX:G1HeapRegionSize=32M -XX:InitiatingHeapOccupancyPercent=90"

  # Holds the extracted Solr index. download.sh streams the compressed backup in,
  # untars it, and deletes the tarball, so peak usage is roughly the index (~111Gi for
  # Babel 2026jul22) plus the compressed tarball during the download (tens of Gi) --
  # there is no longer an uncompressed-backup staging copy (NameResolution#278). 400Gi
  # leaves generous headroom, and does not need to scale with solr.resources.
  storage: 400Gi

  # As far as I know, initresources are only used by the download
  # pod that downloads the Solr backup, which is network-bound,
  # not CPU or memory bound. This used to be 32Gi, but I'm going
  # to reduce it to 1-5Gi. Please increase this if it looks like
  # it'll be helpful.
  initresources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 5Gi
      cpu: 2000m

# You can control the nodeSelector/affinity/tolerations settings for all pods (web, restore, backup) except Solr with the following settings.
app:
  serverName: "infores:sri-name-resolver"
  otel:
    enabled: false
    jaegerHost:
    jaegerPort:
  logLevel: INFO
  nodeSelector:
  affinity:
  tolerations:
  resources:
    requests:
      memory: 1Gi
      cpu: 750m
    limits:
      memory: 2Gi
      cpu: 1000m

nameOverride: ""
fullnameOverride: ""

ingress:
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  pathType: "ImplementationSpecific"
  host:
  class:

blocklist:
  # The URL from where to download the blocklist. This should be a simple text file, where each line contains a CURIE.
  # (If this field is blank, all blocklist functionality will be turned off.)
  url:
  # If a GitHub Personal Access Token is necessary to download the above file, it should be set
  # in `blocklist.secrets.github_personal_access_token` in an encrypted file. You can also
  # set this on Kubernetes by running:
  #   kubectl -n $NAMESPACE create secret generic {{name-lookup.fullname}}-secrets --from-literal=github_personal_access_token=github_pat_...
  # The storage necessary to store the blocklist file. This is currently an ephemeral volume, and because we need
  # to use `split` to split this into 500 ID chunks, we actually need TWICE the amount of storage needed to store
  # the blocklist. Luckily, the blocklist is about 7KB right now, so 100Mi should be future proof for a while.
  storage: 100Mi

x_trapi:
  maturity:
    value: "maturity"
  location:
    value: "location"
