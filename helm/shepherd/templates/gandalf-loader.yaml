{{- if .Values.gandalfLoader.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shepherd.fullname" . }}-gandalf-loader
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.gandalfLoader.backoffLimit | default 1 }}
  ttlSecondsAfterFinished: {{ .Values.gandalfLoader.ttlSecondsAfterFinished | default 300 }}
  template:
    metadata:
      labels:
        {{- include "shepherd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: data-loader
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: data-loader
          image: "{{ .Values.gandalfLoader.image.repository }}:{{ .Values.gandalfLoader.image.tag }}"
          imagePullPolicy: {{ .Values.gandalfLoader.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e

              DEST="/data"
              SENTINEL="${DEST}/.data-ready"
              CHECKSUM_FILE="${DEST}/.source-url-hash"

              # Hash the source URLs to detect changes
              CURRENT_HASH=$(echo '{{ join "," .Values.gandalfLoader.sources | sha256sum }}' | cut -c1-12)

              # Skip download if data exists and source hasn't changed
              {{- if .Values.gandalfLoader.skipIfExists }}
              if [ -f "$SENTINEL" ] && [ -f "$CHECKSUM_FILE" ]; then
                EXISTING_HASH=$(cat "$CHECKSUM_FILE")
                if [ "$CURRENT_HASH" = "$EXISTING_HASH" ]; then
                  echo "Data already present and sources unchanged — skipping download."
                  exit 0
                else
                  echo "Source URLs changed — removing old files and re-downloading."
                  rm -rf ${DEST}/*
                fi
              fi
              {{- end }}

              echo "Downloading data files..."
              {{- range .Values.gandalfLoader.sources }}

              echo "Fetching: {{ . }}"
              FILENAME=$(basename "{{ . }}" | sed 's/?.*//')

              {{- if or (hasSuffix ".tar.gz" .) (hasSuffix ".tgz" .) }}
              wget -q -O "${DEST}/${FILENAME}" "{{ . }}"
              tar xzf "${DEST}/${FILENAME}" -C "$DEST"
              rm -f "${DEST}/${FILENAME}"
              {{- else if hasSuffix ".tar" . }}
              wget -q -O - "{{ . }}" | tar xf - -C "$DEST"
              {{- else if hasSuffix ".zip" . }}
              wget -q -O "/tmp/${FILENAME}" "{{ . }}"
              unzip -o "/tmp/${FILENAME}" -d "$DEST"
              rm -f "/tmp/${FILENAME}"
              {{- else }}
              wget -q -O "${DEST}/${FILENAME}" "{{ . }}"
              {{- end }}
              {{- end }}

              {{- if .Values.gandalfLoader.postDownloadCommand }}
              echo "Running post-download command..."
              {{ .Values.gandalfLoader.postDownloadCommand }}
              {{- end }}

              # Mark download complete
              echo "$CURRENT_HASH" > "$CHECKSUM_FILE"
              date -u '+%Y-%m-%dT%H:%M:%SZ' > "$SENTINEL"
              echo "Data download complete."
          volumeMounts:
            - name: graph-data
              mountPath: {{ .Values.gandalf.sharedData.mountPath }}
          {{- with .Values.gandalfLoader.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: graph-data
          persistentVolumeClaim:
            claimName: {{ include "shepherd.fullname" . }}-gandalf-data
      {{- with .Values.shepherd.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shepherd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}