{{- if .Values.omnicorpLoader.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "shepherd.fullname" . }}-omnicorp-data
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    # Long-lived data volume: never let Helm delete it on upgrade/uninstall.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    {{- toYaml .Values.omnicorpLoader.persistentVolume.accessModes | nindent 4 }}
  {{- with .Values.omnicorpLoader.persistentVolume.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.omnicorpLoader.persistentVolume.size }}
{{- end }}
