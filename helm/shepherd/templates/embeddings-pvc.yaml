{{- if .Values.embeddingsLoader.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "shepherd.fullname" . }}-embeddings-data
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    {{- toYaml .Values.embeddingsLoader.persistentVolume.accessModes | nindent 4 }}
  {{- if .Values.embeddingsLoader.persistentVolume.storageClassName }}
  storageClassName: {{ .Values.embeddingsLoader.persistentVolume.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.embeddingsLoader.persistentVolume.size }}
{{- end }}