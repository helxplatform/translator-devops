apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shepherd.fullname" . }}-arax-pathfinder
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
    service-type: worker
spec:
  replicas: {{ .Values.arax_pathfinder.replicaCount }}
  {{- if .Values.arax_pathfinder.strategy }}
  strategy:
    type: {{ .Values.arax_pathfinder.strategy }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shepherd.selectorLabels" . | nindent 6 }}
      service-type: worker
  template:
    metadata:
      labels:
        {{- include "shepherd.selectorLabels" . | nindent 8 }}
        service-type: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Rolls the worker whenever the arax pathfinder loader's source URLs change,
        # so new pods re-run the init container and open the freshly-loaded data.
        checksum/embeddings-sources: {{ include "shepherd.araxPathfinderSourcesHash" . }}
    spec:
      {{- with .Values.securityContext }}
      securityContext:
        {{ . | toYaml | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for the loader's success-only sentinel. Gating on .data-ready
        # (written last, only on full success) instead of a data file means the
        # worker never starts on a partially-loaded volume.
        - name: arax-pathfinder-wait-for-data
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              until [ -f {{ .Values.araxPathfinderLoader.sharedData.mountPath }}/.data-ready ]; do
                echo "waiting for loader to finish (.data-ready)..."
                sleep 5
              done
              echo "Data ready."
          volumeMounts:
            - name: arax-pathfinder-data
              mountPath: {{ .Values.araxPathfinderLoader.sharedData.mountPath }}
      containers:
        - name: {{ .Chart.Name }}-arax-pathfinder
          image: "{{ .Values.arax_pathfinder.image.repository }}:{{ .Values.shepherd.tag }}"
          imagePullPolicy: "{{ .Values.arax_pathfinder.image.imagePullPolicy }}"
          envFrom:
            - configMapRef:
                name: {{ include "shepherd.fullname" . }}-configmap
          command:
            - 'python'
          args:
            - "worker.py"
          {{- if .Values.arax_pathfinder.resources }}
          resources: {{ toYaml .Values.arax_pathfinder.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ include "shepherd.fullname" . }}-logs-pvc
              mountPath: /app/logs/
            # Shared sqlite data (read-only for the worker)
            - name: arax-pathfinder-data
              mountPath: {{ .Values.araxPathfinderLoader.sharedData.mountPath }}
              readOnly: true
      volumes:
        - name: {{ include "shepherd.fullname" . }}-logs-pvc
          persistentVolumeClaim:
            claimName: {{ include "shepherd.fullname" . }}-logs-pvc
        - name: arax-pathfinder-data
          persistentVolumeClaim:
            claimName: {{ include "shepherd.fullname" . }}-arax-pathfinder-data
      {{- with .Values.shepherd.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shepherd.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shepherd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
