apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shepherd.fullname" . }}-arax
  labels:
    {{- include "shepherd.labels" . | nindent 4 }}
    service-type: worker
spec:
  replicas: {{ .Values.arax.replicaCount }}
  {{ if .Values.arax.strategy }}
  strategy:
    type: {{ .Values.arax.strategy }}
  {{ end }}
  selector:
    matchLabels:
      {{- include "shepherd.selectorLabels" . | nindent 6 }}
      service-type: worker
  template:
    metadata:
      labels:
        {{- include "shepherd.selectorLabels" . | nindent 8 }}
        service-type: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") .  | sha256sum }}
    spec:
      {{- with .Values.securityContext }}
      securityContext:
        {{ . | toYaml | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for the loader's success-only sentinel. Gating on .data-ready
        # (written last, only on full success) instead of a data file means the
        # worker never starts on a partially-loaded volume.
        - name: arax-wait-for-data
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              until [ -f {{ .Values.araxLoader.sharedData.mountPath }}/.data-ready ]; do
                echo "waiting for loader to finish (.data-ready)..."
                sleep 5
              done
              ls -al /data/arax_dbs
              echo "Data ready."
          volumeMounts:
            - name: arax-data
              mountPath: {{ .Values.araxLoader.sharedData.mountPath }}
      containers:
        - name: {{ .Chart.Name }}-arax
          image: "{{ .Values.arax.image.repository }}:{{ .Values.shepherd.tag }}"
          imagePullPolicy: "{{ .Values.arax.image.imagePullPolicy }}"
          envFrom:
            - configMapRef:
                name: {{ include "shepherd.fullname" . }}-configmap
          env:
            - name: TASK_LIMIT
              value: "100"
            - name: ARAX_PATHFINDER_DBS_DIR
              value: "{{ .Values.araxLoader.sharedData.mountPath }}"
            - name: ARAX_DBS_DIR
              value: "/data/arax_dbs/arax_dbs"
          command:
            - 'python'
          args:
            - "worker.py"
          {{ if .Values.arax.resources }}
          resources: {{ toYaml .Values.arax.resources | nindent 12 }}
          {{ end }}
          volumeMounts:
            - name: {{ include "shepherd.fullname" . }}-logs-pvc
              mountPath: /app/logs/
            # Shared sqlite data (read-only for the worker)
            - name: arax-data
              mountPath: {{ .Values.araxLoader.sharedData.mountPath }}
              readOnly: true
      volumes:
        - name: {{ include "shepherd.fullname" . }}-logs-pvc
          persistentVolumeClaim:
            claimName: {{ include "shepherd.fullname" . }}-logs-pvc
        - name: arax-data
          persistentVolumeClaim:
            claimName: {{ include "shepherd.fullname" . }}-arax-data
      {{- with .Values.shepherd.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shepherd.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.shepherd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
