web:
  serverHostName: "serverHostName"

deploymentStrategy: Recreate

nameOverride: ""
fullnameOverride: ""

ingress:
  host: ingress_HOST
  class: ""
  enabled: true
  pathType: "ImplementationSpecific"
  path: "/"
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/connection-proxy-header: keep-alive
    nginx.ingress.kubernetes.io/send-timeout: "86400"
    nginx.ingress.kubernetes.io/service-upstream: 'true'
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
  tls:
    enabled: false

x_trapi:
  maturity:
    value: "maturity"
  location:
    value: "location"

otel:
  # disable otel by default
  enabled: false
  jaeger_host: "jaeger-otel-agent"
  jaeger_port: "6831"

shepherd:
  tag: latest
  logsPVCSize: 3Gi
  lookup_timeout: fillthisin
  kg_retrieval_url: fillthisin
  sync_kg_retrieval_url: fillthisin
  omnicorp_url: fillthisin
  arax_url: fillthisin
  log_level: INFO
  nodeSelector: {}
  affinity: {}
  tolerations: []

probes:
  enabled: false
  failureThreshold: 5
  successThreshold: 1
  period: 120
  timeoutSeconds: 30

shepherd_server:
  image:
    repository: ghcr.io/biopack-team/shepherd/shepherd_server
    imagePullPolicy: Always
  service:
    type: ClusterIP
    port: 5439
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 50
    targetMemory: 50
  resources:
    requests:
      memory: 5Gi
      cpu: 1000m
    limits:
      memory: 8Gi
      cpu: 3000m

filter_kgraph_orphans:
  image:
    repository: ghcr.io/biopack-team/shepherd/filter_kgraph_orphans
