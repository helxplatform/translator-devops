# ---------------------------------------------------------------------------
# Init container — download data from public server(s)
# ---------------------------------------------------------------------------
araxPathfinderLoader:
  sharedData:
    mountPath: /data/arax_pathfinder_dbs
  persistentVolume:
    accessModes:
      - ReadWriteMany
    size: 5Gi
    storageClassName: nfs-client
  enabled: false

  # Image for the init container (needs wget; busybox or alpine work well)
  image:
    repository: curlimages/curl
    tag: "latest"
    pullPolicy: IfNotPresent

  # List of URLs to download. Supported formats:
  #   .tar.gz / .tgz  — extracted automatically
  #   .tar             — extracted automatically
  #   .zip             — extracted automatically (requires unzip in image; use alpine)
  #   anything else    — downloaded as-is into the mount path
  sources: []
    # - https://example.com/graph-data/edges.mmap
    # - https://example.com/graph-data/nodes.lmdb.tar.gz
    # - https://example.com/graph-data/metadata.json

  # Skip download if data already exists and source URLs haven't changed
  skipIfExists: true

  # Optional shell command to run after all downloads complete
  # Runs inside the init container with the data volume mounted
  postDownloadCommand: ""
    # e.g.: "chmod -R 755 /data/graph && echo 'permissions set'"

  # Resources for the init container (downloads can be memory-light)
  resources:
    requests:
      cpu: "1000m"
      memory: "10Gi"
      ephemeral-storage: "10Gi"
    limits:
      cpu: "2"
      memory: "15Gi"
      ephemeral-storage: "10Gi"
  
