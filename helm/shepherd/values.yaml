shepherd_broker:
  image:
    repository: redis/redis-stack-server
    tag: 7.2.0-v11
    imagePullPolicy: Always
  auth:
    password: fillthisin
  dbPath: /data
  service:
    type: ClusterIP
    port: 6379
  autoscaling:
    enabled: false
  resources:
    requests:
      memory: 20Gi
      cpu: 1500m
    limits:
      memory: 25Gi
      cpu: 2000m
  args:
    - --maxmemory
    - '20gb'
    - --maxmemory-policy
    - 'allkeys-lfu'
    - --loglevel
    - 'notice'
    - --logfile
    - '/data/shepherd_broker.log'
    - --stop-writes-on-bgsave-error
    - 'no'
    - --dbfilename
    - 'shepherd_broker.rdb'
    - --proto-max-bulk-len
    - '1000mb'
    - --activedefrag
    - 'yes'
    - --timeout
    - '60'
    - --save
    - '60 1'

