# Default values for plater.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

graph:
  backend: memgraph        # neo4j or memgraph
  external: false

busybox:
  image:
    repository: busybox
    tag: "1.35"

bash:
  image:
    repository: bash
    tag: "5.2.15"

image:
  plater:
    repository:  ghcr.io/translatorsri/plater-clustered
    tag: "v2.3.1"
    imagePullPolicy: Always
  neo4j:
    repository: ghcr.io/translatorsri/plater-neo4j
    tag: "neo4j-5.26"
    imagePullPolicy: Always
  memgraph:
    repository: renci/memgraph
    tag: "3.5.2"
    pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

neo4j:
  # Readiness probes will send a kill signal to the container if
  # it fails enough times.  It's therefore very important
  # that initialDelaySeconds give the cluster time to form, because
  # if readiness probes start immediately after container start,
  # they may end up not forming quickly enough and getting killed.
  readinessProbe:
    initialDelaySeconds: 30
    failureThreshold: 3
    timeoutSeconds: 10
    periodSeconds: 10
    exec:
      command:
        - bash
        - -c
        - IFS="/" read -a auth <<< $NEO4J_AUTH ; cypher-shell -u ${auth[0]} -p ${auth[1]} "match (c) return c limit 1"

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 10
    exec:
      command:
        - bash
        - -c
        - IFS="/" read -a auth <<< $NEO4J_AUTH ; cypher-shell -u ${auth[0]} -p ${auth[1]} "match (c) return c limit 1"

  # Startup probes are used to know when a container application has started.
  # If such a probe is configured, it disables liveness and readiness checks until it succeeds
  startupProbe:
    failureThreshold: 2000
    periodSeconds: 1
    timeoutSeconds: 10
    exec:
      command:
        - bash
        - -c
        - IFS="/" read -a auth <<< $NEO4J_AUTH ; cypher-shell -u ${auth[0]} -p ${auth[1]} "match (c) return c limit 1"
  affinity: {}
  tolerations: []
  nodeSelector: {}

memgraph:
  readinessProbe:
    tcpSocket:
      port: 7687
    initialDelaySeconds: 30
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 10

  livenessProbe:
    tcpSocket:
      port: 7687
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 5
    timeoutSeconds: 10

  startupProbe:
    tcpSocket:
      port: 7687
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 10

service:
  type: ClusterIP
app:
  otel:
    enabled: "False"
    jaegerHost: "http://jaeger-otel-collector"
    jaegerPort: "4317"
  profiler_on: "False"
  gunicorn:
    worker_timeout: 10800
    num_workers: 4
  # this is the timeout used for the http request made to neo4j
  # and also controls the https://neo4j.com/docs/operations-manual/4.2/reference/configuration-settings/#config_dbms.transaction.timeout
  GRAPH_QUERY_TIMEOUT: 10800
  web:
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m

  port: 8080
  automatAddress: http://automat
  bl_version: 4.2.1
  neo4j:
    dataUrl: ""   # URL to neo4j data dump, if deploying internally
    protocol: bolt
    httpPort: 7474
    boltPort: 7687
    password: neo4jkp
    username: neo4j
    # additional jvm parameters for large query strings
    jvmStackSize: 1g
    # These are jvm based values hence suffix with one of the following G, M etc...
    heapSize: 1g
    pageCacheSize: 1g
    # It's used to request the cluster for memory capable of running neo4j per the heap and PageCache values above
    # Compute this value by summing up heapSize + pageCacheSize + (1G for os) + jvmStackSize
    # https://neo4j.com/docs/operations-manual/current/performance/memory-configuration/
    totalMemory:
    storage:
      size: 20Mi
    service:
      type: ClusterIP
    initresources:
      requests:
        memory: 5Gi
        cpu: 500m
      limits:
        memory: 10Gi
        cpu: 1000m
    resources:
      requests:
        cpu: 1000m
        memory: 5Gi
      limits:
        ephemeral-storage: 256Mi
        memory: 6Gi
        cpu: 1500m
  openapi_config:
  # Adds more configs to default open api config
    x-trapi:
      version: 1.5.0
      operations:
        - lookup
        - overlay_connect_knodes
        - annotate_nodes
    x-translator:
      component: KP
      team:
      - '' # add teams
    contact:
      email: "" # email
      name: "" # name
      x-id: "" # link if available
      x-role: "" # role
    termsOfService: "" # link to terms of service
    title: ""
    description: ""
    tags:
     - name: translator
    servers:
      - description: Default server
        # this value should match chart installation name
        # https://automat-dev.renci.org/<chart install name>
        url: ""

  memgraph:
    storage:
      size: 20Mi
    service:
      type: ClusterIP
    boltPort: 7687
    # dataUrl is the base URL with _nodes.cypher, _edges.cypher, and _indexes.cypher to be appended
    # to point to three required memgraph cypher files to populate the database, if deploying internally
    dataUrl: ""
    # BATCH_SIZE controls how many CSV edge rows are processed per transaction with memory usage roughly scale
    # with BATCH_SIZE × num_of_csv_files × average_edge_size
    # Increasing BATCH_SIZE reduces transaction overhead but increases peak memory usage.
    BATCH_SIZE: 2000
    initresources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 1Gi
        cpu: 3000m
    resources:
      requests:
        memory: 5Gi
        cpu: 500m
      limits:
        ephemeral-storage: 256Mi
        memory: 6Gi
        cpu: 1000m

  nodeSelector: {}
  tolerations: []
  affinity: {}

externalNeo4j:
  hostName: ""
  boltPort: 7687
  httpPort: 7474
  username: neo4j
  password: ""

externalMemgraph:
  hostName: ""
  boltPort: 7687

skipAttributes:
graphMetadataUrl: ""
schemaUrl: ""
metadataUrl: ""
metaKGUrl: ""
testingDataUrl: ""

datasetDesc:
  version: ''
  description: ''
  dataseturl: ''
  generatorCode: ''
  neo4j_dump: ""
  provenanceTag: "infores:automat.platersource"
  license: "" # link to terms of service

x_trapi:
  maturity:
    value: "maturity"
  location:
    value: "location"
