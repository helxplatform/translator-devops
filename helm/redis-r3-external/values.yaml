info-content:
  auth:
    enabled: true
  master:
    persistence:
      # In NodeNorm 2.5, we add the preferred names to this database. It will probably end up being bigger than
      # id-categories (same number of keys, but longer strings than a Biolink type), so I'll give it 200Gi for now,
      # and then I will scale it down after the first load tells us how big it actually is.
      size: 200Gi
    resources:
      limits:
        cpu: 1500m
        memory: 200Gi
      requests:
        cpu: 500m
        memory: 150Gi
    readinessProbe:
      enabled: false
    startupProbe:
