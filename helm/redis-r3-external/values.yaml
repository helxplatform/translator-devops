
id-id:
  auth:
    enabled: true
  master:
    persistence:
      size: 150Gi
    resources:
      limits:
        cpu: 1500m
        memory: 150Gi
      requests:
        cpu: 200m
        memory: 80Gi
    readinessProbe:
      enabled: false
    startupProbe:
      enabled: false
    livenessProbe:
      enabled: false
    extraFlags:
    # No automatic RDB snapshots. Persistence is explicit: mode:load disables
    # saves at runtime and BGSAVEs manually at the end; mode:restore BGSAVEs and
    # waits for completion at the end of run_pipe.sh. An automatic `save` policy
    # can't fire only after a populate finishes without also forking repeatedly
    # *during* it, which is pure copy-on-write waste on these large DBs. See the
    # NodeNorm documentation/Loader.md.
    - '--save ""'
    - "--appendonly no"

  replica:
    replicaCount: 0

