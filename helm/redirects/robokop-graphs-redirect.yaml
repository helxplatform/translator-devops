apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: robokop-graphs-redirect
  namespace: robokop-u24
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: "https://stars.renci.org/var/plater/graphs/"
    nginx.ingress.kubernetes.io/permanent-redirect-code: '307'
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0,::/0"
spec:
  rules:
    - host: robokop.renci.org
      http:
        paths:
          - path: /graphs
            pathType: Prefix
            backend:
              service:
                name: robokop-graphs
                port:
                  number: 80
