{{- if and (eq .Values.graph.backend "gandalf") (not .Values.graph.external) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plater.fullname" . }}-gandalf
  labels:
    {{- include "plater.labels" . | nindent 4 }}
spec:
  {{- if not .Values.app.gandalf.autoscaling.enabled }}
  replicas: {{ .Values.app.gandalf.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "plater.selectorLabels" . | nindent 6 }}
      service-type: gandalf-database
  template:
    metadata:
      labels:
        {{- include "plater.selectorLabels" . | nindent 8 }}
        service-type: gandalf-database
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") .  | sha256sum }}
    spec:
      {{- with .Values.securityContext }}
      securityContext:
        {{ . | toYaml | nindent 8 }}
      {{- end }}
      # initContainers:
      #   - name: localize-data
      #     image: busybox:1.36
      #     command:
      #       - sh
      #       - -c
      #       - |
      #         echo "Copying graph data to local disk..."
      #         cp -r /shared/. {{ .Values.app.gandalf.sharedData.mountPath }}
      #         echo "Done!"
      #     volumeMounts:
      #       - name: {{ include "plater.fullname" . }}-gandalf-data-shared
      #         mountPath: /shared
      #         readOnly: true
      #       - name: {{ include "plater.fullname" . }}-gandalf-data-local
      #         mountPath: {{ .Values.app.gandalf.sharedData.mountPath }}
      containers:
        - name: {{ .Chart.Name }}-gandalf
          image: "{{ .Values.image.gandalf.repository }}:{{ .Values.image.gandalf.tag }}"
          imagePullPolicy: {{ .Values.image.gandalf.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "plater.fullname" . }}-configmap
          env:
            - name: PYSTOW_HOME
              value: "/tmp/pystow"
          command:
            - 'gunicorn'
          args:
            - "gandalf.server:APP"
            - "-c"
            - "gunicorn.conf.py"
          {{ if .Values.app.gandalf.resources }}
          resources: {{ toYaml .Values.app.gandalf.resources | nindent 12 }}
          {{ end }}
          volumeMounts:
            # -- Shared mmap/LMDB data
            - name: {{ include "plater.fullname" . }}-gandalf-data
              mountPath: {{ .Values.app.gandalf.sharedData.mountPath }}
              readOnly: true
      volumes:
        # -- Shared graph data volume (mmap + LMDB files)
        - name: {{ include "plater.fullname" . }}-gandalf-data
          persistentVolumeClaim:
            claimName: {{ include "plater.fullname" . }}-gandalf-data
            readOnly: true
        # - name: {{ include "plater.fullname" . }}-gandalf-data-local
        #   emptyDir:
        #     sizeLimit: 110Gi
      {{- with .Values.neo4j.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.neo4j.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.neo4j.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end }}