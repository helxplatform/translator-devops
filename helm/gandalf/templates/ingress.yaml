{{- if .Values.ingress.enabled -}}
{{- if and .Values.ingress.class (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.gandalf.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.gandalf.annotations "kubernetes.io/ingress.class" .Values.ingress.class }}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ include "gandalf.fullname" . }}-ingress
  labels:
    {{- include "gandalf.labels" . | nindent 4 }}
  {{- with .Values.ingress.gandalf.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  {{- if and .Values.ingress.class (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.class }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
      - {{ .Values.ingress.gandalf.host }}
    secretName: {{ .Values.ingress.gandalf.host }}-tls
  {{- end }}
  rules:
  - host: {{ .Values.ingress.gandalf.host | quote }}
    http:
      paths:
        - path: {{ .Values.ingress.path }}
          {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
          pathType: "{{ .Values.ingress.pathType }}"
          {{- end }}
          backend:
            {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
            service:
              name: {{ include "gandalf.fullname" . }}-service
              port:
                number: {{ .Values.app.gandalf.service.port }}
            {{- else }}
            serviceName: {{ include "gandalf.fullname" . }}-service
            servicePort: {{ .Values.app.gandalf.service.port }}
            {{- end }}
{{- end }}
