apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gandalf.fullname" . }}-data
  labels:
    {{- include "gandalf.labels" . | nindent 4 }}
  annotations:
    # Long-lived data volume: never let Helm delete it on upgrade/uninstall.
    # No hook annotations: as a normal resource Helm applies the PVC before the
    # workloads, so the (normal Job) loader finds it already present. Helm adds
    # its own ownership metadata, so meta.helm.sh/* annotations are not needed.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    {{- toYaml .Values.app.gandalf.persistentVolume.accessModes | nindent 4 }}
  {{- with .Values.app.gandalf.persistentVolume.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.app.gandalf.persistentVolume.size }}
