apiVersion: apps/v1
kind: Deployment
metadata:
  name: annotation-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: annotation-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: annotation-backend
  template:
    metadata:
      labels:
        app: annotation-backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        env:
        - name: DATABASE_URL
          value: "sqlite:////app/data/annotations.db"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: annotation-data-pvc