{{- if .Values.backend.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "robokop-ui.fullname" .}}-graph-metadata-pvc
  labels:
    {{- include "robokop-ui.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Mi
  storageClassName: basic
{{- end }}
