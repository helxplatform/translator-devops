apiVersion: v1
kind: Service
metadata:
  name: {{ include "robokop-ui.fullname" .}}-backend-svc
  labels:
    {{- include "robokop-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "robokop-ui.selectorLabels" . | nindent 4 }}
    service-type: webserver
