apiVersion: v2
name: jaeger-v2
description: Jaeger v2 all-in-one with a single-node OpenSearch backend
type: application

# Version of this wrapper chart. Bump when its templates, values or dependencies change.
version: 0.1.0
appVersion: "2.22.0"

# Upstream chart versions are pinned here and in Chart.lock. To bump one, change the version
# below, run `helm dependency update`, and commit Chart.yaml, Chart.lock and charts/*.tgz.
dependencies:
  - name: jaeger
    version: 4.16.1
    repository: https://jaegertracing.github.io/helm-charts
  - name: opensearch
    version: 3.9.0
    repository: https://opensearch-project.github.io/helm-charts