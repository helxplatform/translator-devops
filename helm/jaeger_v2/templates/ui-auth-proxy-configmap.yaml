{{- /*
nginx config for the UI login sidecar (jaeger.jaeger.oAuthSidecar in values.yaml).
Requires a login for the UI and forwards to Jaeger on 127.0.0.1:16686. /healthz stays open
for probes and load balancer health checks. Replaces the image's whole nginx.conf so the
worker count can be fixed at 1 (the default starts one worker per node CPU).
*/ -}}
{{- if .Values.jaeger.jaeger.oAuthSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-ui-auth-proxy
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr notice;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        access_log /dev/stdout;

        server {
            listen 8080;

            location = /healthz {
                access_log off;
                return 200 "ok\n";
            }

            location / {
                auth_basic "Jaeger";
                auth_basic_user_file /etc/nginx/auth/htpasswd;

                proxy_pass http://127.0.0.1:16686;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_buffering off;
                proxy_read_timeout 300s;
            }
        }
    }
{{- end }}