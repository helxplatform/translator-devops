# elasticsearch-values.yaml

# Resource names are <clusterName>-<nodeGroup> (here jaeger-es-master), independent of the
# Helm release name. A Jaeger-specific name avoids collisions with other Elasticsearch
# deployments in the same namespace. Jaeger connects to https://jaeger-es-master:9200.
clusterName: "jaeger-es"

# Single master node — sufficient for dev, avoids needing 3-node quorum
replicas: 1
minimumMasterNodes: 1

# Resource limits appropriate for a shared org dev cluster
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# JVM heap — should be ~50% of memory limit
esJavaOpts: "-Xmx1g -Xms1g"

# Persistence with your org's StorageClass
volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  storageClassName: basic
  resources:
    requests:
      storage: 30Gi

esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false

# Use a pre-created jaeger-es-credentials secret for the elastic user's password.
# The chart's own secret (secret.enabled: true) regenerates a random password on every
# helm upgrade, which would break Jaeger's access. Jaeger reads the same secret.
secret:
  enabled: false

extraEnvs:
  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: jaeger-es-credentials
        key: password

# Single node can't have replicas for ES indices — set this to avoid yellow health
# Jaeger will use index templates that override this, but good to have as default
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

# Disable the privileged sysctl init container — blocked by org policy
sysctlInitContainer:
  enabled: false

# Comply with psp-seccomp: set RuntimeDefault on both containers
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

