# dev: RENCI (Sterling) deployment. Layered on top of values.yaml.

jaeger:
  jaeger:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - translator-otel-dev.apps.renci.org
      tls:
        - hosts:
            - translator-otel-dev.apps.renci.org
          secretName: translator-otel-dev.apps.renci.org-tls
      pathType: ImplementationSpecific

opensearch:
  persistence:
    storageClass: basic