# dev: RENCI (Sterling) deployment. Layered on top of values.yaml.

jaeger:
  jaeger:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - translator-otel.apps.renci.org
      tls:
        - hosts:
            - translator-otel.apps.renci.org
          secretName: translator-otel.apps.renci.org-tls
      pathType: ImplementationSpecific
    # UI login sidecar. Set to false to serve the UI without a login (the jaeger-ui-auth secret
    # is then not needed).
    oAuthSidecar:
      enabled: false

opensearch:
  persistence:
    storageClass: basic