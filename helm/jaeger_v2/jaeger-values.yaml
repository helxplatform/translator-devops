# jaeger-values.yaml

storage:
  type: elasticsearch

# Used by maintenance CronJobs (esIndexCleaner, esRollover)
elasticsearch:
  url: "https://elasticsearch-master:9200"
  usePassword: true
  username: "elastic"
  existingSecret: jaeger-es-credentials
  existingSecretKey: ES_PASSWORD

userconfig:
  extensions:
    jaeger_storage:
      backends:
        some_storage:
          elasticsearch:
            server_urls:
              - "https://elasticsearch-master:9200"
            tls:
              insecure_skip_verify: true    # skip self-signed cert validation
            auth:
              basic:
                username: "elastic"
                password: "XUOaoqxgyz54QWPa"
            indices:
              index_prefix: "jaeger"
              spans:
                date_layout: "2006-01-02"
                rollover_frequency: "day"
                shards: 1      # single ES node — no replicas needed
                replicas: 0
              services:
                date_layout: "2006-01-02"
                rollover_frequency: "day"
                shards: 1
                replicas: 0
              dependencies:
                date_layout: "2006-01-02"
                rollover_frequency: "day"
                shards: 1
                replicas: 0
              sampling:
                date_layout: "2006-01-02"
                rollover_frequency: "day"
                shards: 1
                replicas: 0
    
    jaeger_query:
      storage:
        traces: some_storage

    healthcheckv2:
      use_v2: true
      http:
        endpoint: "0.0.0.0:13133"

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  
  processors:
    batch:

  exporters:
    jaeger_storage_exporter:
      trace_storage: some_storage

  service:
    extensions:
      - jaeger_storage
      - jaeger_query
      - healthcheckv2
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - jaeger_storage_exporter
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: "0.0.0.0"
                  port: 8888
      logs:
        level: info

jaeger:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    labels:
      app: jaeger
      version: "2.17.0" 
    hosts:
      - translator-otel-dev.apps.renci.org
    tls:
      - hosts:
          - translator-otel-dev.apps.renci.org
        secretName: translator-otel-dev.apps.renci.org-tls
    pathType: ImplementationSpecific

# Index cleaner CronJob — prunes indices older than N days
esIndexCleaner:
  enabled: true
  numberOfDays: 7
  schedule: "55 23 * * *"

# Comply with org's seccomp policy (same pattern that worked for ES)
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
