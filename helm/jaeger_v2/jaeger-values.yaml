# jaeger-values.yaml

storage:
  type: elasticsearch
  # Only used by the ES maintenance CronJobs (esIndexCleaner, esRollover).
  # Jaeger itself reads its ES settings from userconfig below.
  # The password comes from the jaeger-es-credentials secret via esIndexCleaner.extraEnv.
  elasticsearch:
    url: "https://jaeger-es-master:9200"
    user: "elastic"

userconfig:
  extensions:
    jaeger_storage:
      backends:
        some_storage:
          elasticsearch:
            server_urls:
              - "https://jaeger-es-master:9200"
            tls:
              insecure_skip_verify: true    # skip self-signed cert validation
            auth:
              basic:
                username: "elastic"
                password: "${env:ES_PASSWORD}"   # from jaeger.extraEnv (jaeger-es-credentials secret)
            indices:
              index_prefix: "jaeger"
              spans:
                date_layout: "2006-01-02"
                rollover_frequency: "day"
                shards: 1      # single ES node — no replicas needed
                replicas: 0
              services:
                date_layout: "2006-01-02"
                rollover_frequency: "day"
                shards: 1
                replicas: 0
              dependencies:
                date_layout: "2006-01-02"
                rollover_frequency: "day"
                shards: 1
                replicas: 0
              sampling:
                date_layout: "2006-01-02"
                rollover_frequency: "day"
                shards: 1
                replicas: 0

    jaeger_query:
      storage:
        traces: some_storage

    healthcheckv2:
      use_v2: true
      http:
        endpoint: "0.0.0.0:13133"

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  processors:
    batch:

  exporters:
    jaeger_storage_exporter:
      trace_storage: some_storage

  service:
    extensions:
      - jaeger_storage
      - jaeger_query
      - healthcheckv2
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - jaeger_storage_exporter
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: "0.0.0.0"
                  port: 8888
      logs:
        level: info

jaeger:
  extraEnv:
    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jaeger-es-credentials
          key: password
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    labels:
      app: jaeger
      version: "2.22.0"
    hosts:
      - translator-otel-dev.apps.renci.org
    tls:
      - hosts:
          - translator-otel-dev.apps.renci.org
        secretName: translator-otel-dev.apps.renci.org-tls
    pathType: ImplementationSpecific

# Index cleaner CronJob — prunes indices older than N days
esIndexCleaner:
  enabled: true
  numberOfDays: 14
  schedule: "55 23 * * *"
  extraEnv:
    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jaeger-es-credentials
          key: password
  cmdlineParams:
    es.tls.enabled:
    es.tls.skip-host-verify:    # self-signed ES cert, same as insecure_skip_verify in userconfig
    index-prefix: "jaeger"      # must match userconfig index_prefix

# Comply with org's seccomp policy (same pattern that worked for ES)
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Transitional alias: apps configured for Jaeger v1 send OTLP to jaeger-otel-collector.
# This Service points that name at the v2 all-in-one pod so they keep working during cutover.
# Remove once all apps point at the "jaeger" service.
extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: jaeger-otel-collector
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: otlp-alias
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: all-in-one
      ports:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          appProtocol: grpc
        - name: otlp-http
          port: 4318
          targetPort: 4318
          appProtocol: http
