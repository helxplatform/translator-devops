# -- Number of pod replicas
replicaCount: 1

image:
  # -- Container image repository
  repository: docker.io/hsrenci/graph_registry
  # -- Image pull policy
  pullPolicy: Always
  # -- Image tag (defaults to Chart appVersion)
  tag: "0.0.1"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the release name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
app:
  # -- Port the FastAPI app listens on
  port: 8000
  # -- Root directory the registry indexes.
  registryRoot: /path/to/graphs
  # -- Password required to call the /refresh endpoint (stored as a k8s Secret)
  refreshPassword: "changeme"
  # -- Additional environment variables (list of {name, value} objects)
  extraEnv: []
  #   - name: LOG_LEVEL
  #     value: info

# ---------------------------------------------------------------------------
# Shared directory / persistence
# ---------------------------------------------------------------------------
persistence:
  # -- Enable the PersistentVolumeClaim for the shared directory
  enabled: false
  # -- Storage class (must support ReadWriteMany for multi-replica).
  #    Leave empty to use the cluster default.
  storageClassName: ""
  # -- Access modes
  accessModes:
    - ReadWriteMany
  # -- Requested storage size
  size: 5Gi
  # -- Annotations for the PVC
  annotations: {}
  # -- Use an existing PVC instead of creating one
  existingClaim: ""

# ---------------------------------------------------------------------------
# NFS volume mount (e.g. RENCI Sterling /projects storage)
# ---------------------------------------------------------------------------
nfs:
  # -- Enable the NFS volume mount
  enabled: true
  # -- NFS server hostname
  server: server.hostname.com
  # -- Export path on the NFS server
  path: /path/to/graphs
  # -- Mount path inside the container
  mountPath: /path/to/graphs
  # -- Mount the NFS volume as read-only
  readOnly: true

# ---------------------------------------------------------------------------
# Security contexts
#
# The app only ever reads from the registry root, so it runs as an unprivileged
# user with a read-only root filesystem. The only writable path is the emptyDir
# mounted at /tmp (see tmpVolume below).
# ---------------------------------------------------------------------------
# -- Pod security context (the UID/GID here must be able to read the NFS export)
podSecurityContext:
  # -- Refuse to start if the effective user resolves to root (UID 0)
  runAsNonRoot: true
  # -- UID that owns the NFS files (Sterling service account)
  runAsUser: 30000
  # -- GID for your /projects storage group
  runAsGroup: 1000           # <-- CHANGE ME: set to your storage GID
  # -- Use the container runtime's default seccomp profile
  seccompProfile:
    type: RuntimeDefault
  # -- Optional: additional group memberships
  # supplementalGroups:
  #   - 12345

# -- Container security context
securityContext:
  # -- Refuse to start if the effective user resolves to root (UID 0)
  runAsNonRoot: true
  # -- Nothing is written outside /tmp, so the image filesystem stays immutable
  readOnlyRootFilesystem: true
  # -- Block setuid binaries from gaining privileges beyond the pod's user
  allowPrivilegeEscalation: false
  # -- The app binds an unprivileged port and needs no Linux capabilities
  capabilities:
    drop:
      - ALL

# -- Writable scratch space, always mounted at /tmp. Not optional: the root
#    filesystem is read-only above, and Python's tempfile defaults to /tmp.
tmpVolume:
  # -- Cap the emptyDir so a runaway temp file can't fill the node
  sizeLimit: 64Mi

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  # -- Service type: ClusterIP, NodePort, or LoadBalancer
  type: ClusterIP
  # -- Service port (external)
  port: 80

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  # -- Enable Ingress resource
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/rewrite-target: /
  # -- Ingress hosts
  hosts:
    - host: some-url.org
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration
  tls:
    - secretName: some-url.org-tls
      hosts:
          - some-url.org

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 2Gi

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

# ---------------------------------------------------------------------------
# Autoscaling (optional)
# ---------------------------------------------------------------------------
autoscaling:
  # -- Enable HorizontalPodAutoscaler
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 75
  # -- Target memory utilization percentage (optional)
  # targetMemoryUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# Service Account
# ---------------------------------------------------------------------------
serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations for the service account
  annotations: {}
  # -- Service account name (auto-generated if empty)
  name: ""

# -- Pod annotations
podAnnotations: {}

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}
